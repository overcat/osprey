name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # slug is the folder mygo builds the platform's app into. Linux x64
      # also checks what is the same everywhere, and builds both Windows
      # apps with their installers, as the Release workflow does.
      matrix:
        include:
          - { name: Linux x64, slug: linux-amd64, os: ubuntu-latest, platforms: "linux/amd64,windows/amd64,windows/arm64", checks: true }
          - { name: Linux ARM, slug: linux-arm64, os: ubuntu-24.04-arm, platforms: linux/arm64 }
          - { name: macOS ARM, slug: darwin-arm64, os: macos-latest, platforms: darwin/arm64 }
          - { name: Windows x64, slug: windows-amd64, os: windows-latest, platforms: windows/amd64 }
          - { name: Windows ARM, slug: windows-arm64, os: windows-11-arm, platforms: windows/arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pango lays out the text of the UI tests; GTK and a virtual display
      # run the app itself; NSIS makes the Windows installer.
      - name: Install GTK, a font, a virtual display and NSIS
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libpangocairo-1.0-0 fonts-dejavu-core xvfb nsis

      - name: Check formatting
        if: matrix.checks
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Check that go.mod and go.sum are tidy
        if: matrix.checks
        run: go mod tidy -diff
      - name: Vet for every platform
        if: matrix.checks
        run: |
          for os in darwin linux windows; do
            GOOS=$os go vet ./...
            GOOS=$os go vet -tags mygo_noinspector ./...
          done

      # The race detector needs cgo, and doesn't run on Windows on ARM.
      - name: Test
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

      # A Windows app takes osp.exe and osprey.com beside Osprey.exe.
      - name: Package
        run: |
          case "${{ matrix.platforms }}" in
            *windows*) scripts/windows-launchers.sh ;;
          esac
          go tool mygo build -platform "${{ matrix.platforms }}" -o "$RUNNER_TEMP/build"

      - name: Open a repository in Osprey, and save a picture of the window
        run: |
          app="$RUNNER_TEMP/build/${{ matrix.slug }}"
          shot="$RUNNER_TEMP/shots/${{ matrix.slug }}.png"
          case "$RUNNER_OS" in
            Linux) xvfb-run -a scripts/smoke-test.sh "$app/osprey" "$shot" ;;
            macOS) scripts/smoke-test.sh "$app/Osprey.app/Contents/MacOS/Osprey" "$shot" ;;
            Windows) scripts/smoke-test.sh "$app/Osprey.exe" "$shot" ;;
          esac

      - name: Check the command line, through osp.exe and osprey.com
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'build\${{ matrix.slug }}'
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $out = & "$app\osprey.com" --version
          if ($LASTEXITCODE -ne 0 -or $out -ne "osprey $version") { throw "osprey.com --version: exit $LASTEXITCODE, '$out'" }
          $out = & "$app\osp.exe" --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Usage:') { throw "osp.exe --help: exit $LASTEXITCODE" }
          & "$app\osp.exe" --no-such-option 2>$null
          if ($LASTEXITCODE -ne 2) { throw "osp.exe with an unknown option: exit $LASTEXITCODE, not 2" }
          & "$app\osp.exe" install-cli
          if ($LASTEXITCODE -ne 0) { throw "osp.exe install-cli: exit $LASTEXITCODE" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $app) { throw "install-cli didn't put $app on the PATH" }
          & "$app\osp.exe" uninstall-cli
          if ($LASTEXITCODE -ne 0) { throw "osp.exe uninstall-cli: exit $LASTEXITCODE" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $app) { throw "uninstall-cli left $app on the PATH" }
          exit 0

      # The installer puts Osprey's folder on the PATH, and its uninstaller
      # takes it off (scripts/windows-installer.nsh).
      - name: Install Osprey with its installer, and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'build\${{ matrix.slug }}') -Filter 'osprey-setup-*.exe' | Select-Object -First 1
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\Osprey'
          $onPath = { ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $folder }
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          if (-not (Test-Path "$folder\osp.exe")) { throw "the installer put no osp.exe in $folder" }
          if (-not (& $onPath)) { throw "the installer didn't put $folder on the PATH" }
          # With _?, the uninstaller runs in place, rather than from a copy
          # of itself, which Start-Process wouldn't wait for.
          Start-Process "$folder\Uninstall.exe" -ArgumentList '/S', "_?=$folder" -Wait
          if (& $onPath) { throw "the uninstaller left $folder on the PATH" }

      # The picture goes up from a failed run too, to see what it showed.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshot-${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/shots/
      # Each job's own platform's packages, the build it tested; the macOS
      # app goes as its .dmg, as an artifact keeps no executable bits.
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/build/${{ matrix.slug }}/*.dmg
            ${{ runner.temp }}/build/${{ matrix.slug }}/*.deb
            ${{ runner.temp }}/build/${{ matrix.slug }}/*.tar.gz
            ${{ runner.temp }}/build/${{ matrix.slug }}/*.exe
            ${{ runner.temp }}/build/${{ matrix.slug }}/*.com
